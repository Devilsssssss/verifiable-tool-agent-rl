[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "verifiable-tool-agent-rl"
version = "0.1.0"
description = "A stateful, verifiable tool-agent environment for SFT and GRPO experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
train = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3.2,<6",
  "numpy>=1.26,<2",
  "peft>=0.14,<1",
  "pyarrow>=25,<26",
  "torch==2.5.1",
  "transformers>=5.2,<5.3",
  "trl>=1.14,<1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolrl"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
